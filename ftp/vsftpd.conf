# Widgetorium FTP: intentionally misconfigured vsftpd.
# vulns 15 (anon write), 16 (weak local creds), 17 (no chroot jail),
# 18 (cleartext), 19 (shared upload dir == web root).

listen=YES
listen_ipv6=NO
background=NO
seccomp_sandbox=NO
pasv_promiscuous=NO

# vsftpd's per-connection namespace isolation (new PID + net namespace via
# clone()) is unreliable inside a container and segfaults intermittently on
# some hosts. The container is already the isolation boundary here.
isolate=NO
isolate_network=NO

# --- vuln 15: anonymous login with full write access ----------------------
anonymous_enable=YES
anon_upload_enable=YES
anon_mkdir_write_enable=YES
anon_other_write_enable=YES
no_anon_password=YES
anon_root=/srv/ftp
# 022 so uploaded files are world-readable and Apache (a different uid) serves
# them straight back out (vuln 19).
anon_umask=022
anon_world_readable_only=NO

# --- vuln 16: local service account, weak password (ftpuser:ftpuser) ------
local_enable=YES
write_enable=YES
local_umask=022

# --- vuln 17: local users are NOT jailed --------------------------------
# ftpuser can cd / and read the whole container filesystem, and reach the
# shared /srv/ftp/upload mount to drop files for the web side.
chroot_local_user=NO
allow_writeable_chroot=YES

# --- vuln 18: no TLS, credentials cross the wire in cleartext -----------
ssl_enable=NO
force_local_logins_ssl=NO
force_local_data_ssl=NO

# --- passive mode: range must match the published ports in compose -----
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_address=127.0.0.1

# hide_ids avoids a per-file passwd/group lookup during LIST. On Alpine/musl
# those lookups can segfault vsftpd, so this is a stability fix, not a
# hardening one (the lab's weaknesses are elsewhere).
hide_ids=YES

# --- logging (useful for the packet-capture exercise write-up) ---------
xferlog_enable=YES
log_ftp_protocol=YES
xferlog_std_format=NO
vsftpd_log_file=/var/log/vsftpd.log

secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
