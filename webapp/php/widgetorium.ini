; Widgetorium PHP config. Every setting here is deliberately loose.

; vuln 14: stack traces and errors rendered straight into the response.
; The db error handler also checks getenv('VERBOSE_ERRORS') so an instructor
; can suppress just the SQL echo without touching this file.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
html_errors = On

; information disclosure: X-Powered-By, version in error pages
expose_php = On

allow_url_fopen = On

; vuln 13: the app rolls its own predictable cookie, but keep the native
; session flags weak too so nothing accidentally hardens the story.
session.cookie_httponly = 0
session.cookie_secure = 0
session.use_strict_mode = 0
session.use_only_cookies = 0

; vuln 12: generous upload limits, no extra checks
file_uploads = On
upload_max_filesize = 25M
post_max_size = 26M
max_file_uploads = 50
