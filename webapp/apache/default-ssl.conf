<IfModule mod_ssl.c>

# --- shared weak-TLS profile (vuln 7) --------------------------------------
# Set once in server context so every vhost below inherits it. TLS 1.0/1.1 stay
# on the table, @SECLEVEL=0 lets OpenSSL negotiate SHA1 / CBC / small-DH suites,
# and the DH params are 1024-bit. The base image's OpenSSL is built without RC4,
# 3DES and EXPORT, so those specific suites cannot be offered regardless.
SSLProtocol           all -SSLv3
SSLProxyProtocol      all -SSLv3
SSLHonorCipherOrder   off
SSLCipherSuite        "DEFAULT:@SECLEVEL=0:AES128-SHA:AES256-SHA:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA:CAMELLIA128-SHA:DES-CBC3-SHA:!aNULL"
SSLProxyCipherSuite   "DEFAULT:@SECLEVEL=0"
SSLOpenSSLConfCmd     DHParameters /etc/ssl/widgetorium/dhparam-1024.pem

# --- default vhost: the storefront -------------------------------------------
# No SNI, a bare-IP connection, or a Host that matches nothing below lands here.
# vuln 5: server.crt has CN=widget-store-prod-01 and no subjectAltName.
<VirtualHost *:443>
    ServerName widgetorium.local
    ServerAlias localhost widgetorium.lab www.widgetorium.lab
    ServerAlias corp.widgetorium.lab www.corp.widgetorium.lab
    ServerAlias shop.corp.widgetorium.lab store.corp.widgetorium.lab
    ServerAlias api.corp.widgetorium.lab legacy.corp.widgetorium.lab
    ServerAdmin dev@widgetorium.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options +Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile    /etc/ssl/widgetorium/server.crt
    SSLCertificateKeyFile /etc/ssl/widgetorium/server.key

    # vuln 8: no Strict-Transport-Security header here. The entrypoint drops one
    # into conf-enabled/ only when SEND_HSTS=1.

    LogLevel info
    ErrorLog  ${APACHE_LOG_DIR}/ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
</VirtualHost>

# --- internal vhosts over TLS ---------------------------------------------
# vuln 22: these present corp.crt, whose subjectAltName lists every internal
# hostname the team could think of, including several that are NOT in the DNS
# zone (git, jenkins, vault, registry). Even with the zone transfer locked, a
# single `openssl s_client -servername admin.corp.widgetorium.lab` hands the
# tester the whole inventory.
<VirtualHost *:443>
    ServerName admin.corp.widgetorium.lab
    DocumentRoot /var/www/vhosts/admin
    <Directory /var/www/vhosts/admin>
        Options +Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    SSLEngine on
    SSLCertificateFile    /etc/ssl/widgetorium/corp.crt
    SSLCertificateKeyFile /etc/ssl/widgetorium/corp.key
    LogLevel info
    ErrorLog  ${APACHE_LOG_DIR}/admin_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/admin_ssl_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName dev.corp.widgetorium.lab
    DocumentRoot /var/www/vhosts/dev
    <Directory /var/www/vhosts/dev>
        Options +Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    SSLEngine on
    SSLCertificateFile    /etc/ssl/widgetorium/corp.crt
    SSLCertificateKeyFile /etc/ssl/widgetorium/corp.key
    LogLevel info
    ErrorLog  ${APACHE_LOG_DIR}/dev_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/dev_ssl_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName staging.corp.widgetorium.lab
    DocumentRoot /var/www/vhosts/staging
    Header set X-Env "staging"
    <Directory /var/www/vhosts/staging>
        Options +Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    SSLEngine on
    SSLCertificateFile    /etc/ssl/widgetorium/corp.crt
    SSLCertificateKeyFile /etc/ssl/widgetorium/corp.key
    LogLevel info
    ErrorLog  ${APACHE_LOG_DIR}/staging_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/staging_ssl_access.log combined
</VirtualHost>

</IfModule>
