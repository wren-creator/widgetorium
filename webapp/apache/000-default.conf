<VirtualHost *:80>
    ServerName widgetorium.local
    ServerAdmin dev@widgetorium.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options +Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Deliberately noisy logging; the verbose-errors lesson pairs with this.
    LogLevel info
    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
