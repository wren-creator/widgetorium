# Name-based virtual hosts on port 80.
#
# The FIRST block is the default: any request whose Host header matches nothing
# below (a bare IP, `localhost`, a fuzzing wordlist entry) lands here, on the
# storefront. Every existing scenario hits http://127.0.0.1:8080/ with no Host
# header and still gets the shop.
#
# The admin / dev / staging blocks answer only to their exact hostnames. They
# are the vhost-discovery lesson (bug 21): same IP, different apps, invisible to
# a plain directory brute force.

<VirtualHost *:80>
    ServerName widgetorium.local
    ServerAlias localhost widgetorium.lab www.widgetorium.lab
    ServerAlias corp.widgetorium.lab www.corp.widgetorium.lab
    ServerAlias shop.corp.widgetorium.lab store.corp.widgetorium.lab
    ServerAlias api.corp.widgetorium.lab legacy.corp.widgetorium.lab
    ServerAdmin dev@widgetorium.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options +Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Deliberately noisy logging; the verbose-errors lesson pairs with this.
    LogLevel info
    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# --- internal: admin console -------------------------------------------------
<VirtualHost *:80>
    ServerName admin.corp.widgetorium.lab
    DocumentRoot /var/www/vhosts/admin

    <Directory /var/www/vhosts/admin>
        Options +Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    LogLevel info
    ErrorLog  ${APACHE_LOG_DIR}/admin_error.log
    CustomLog ${APACHE_LOG_DIR}/admin_access.log combined
</VirtualHost>

# --- internal: developer sandbox -----------------------------------------
<VirtualHost *:80>
    ServerName dev.corp.widgetorium.lab
    DocumentRoot /var/www/vhosts/dev

    <Directory /var/www/vhosts/dev>
        # bug 23: directory listing on, nothing hidden.
        Options +Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    LogLevel info
    ErrorLog  ${APACHE_LOG_DIR}/dev_error.log
    CustomLog ${APACHE_LOG_DIR}/dev_access.log combined
</VirtualHost>

# --- internal: staging copy of the store -------------------------------
<VirtualHost *:80>
    ServerName staging.corp.widgetorium.lab
    DocumentRoot /var/www/vhosts/staging
    Header set X-Env "staging"

    <Directory /var/www/vhosts/staging>
        Options +Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    LogLevel info
    ErrorLog  ${APACHE_LOG_DIR}/staging_error.log
    CustomLog ${APACHE_LOG_DIR}/staging_access.log combined
</VirtualHost>
