# vuln 9: serve the planted /admin/.git directory.
# Some base images ship a global rule that denies dot-files. Re-grant it for
# this one path and turn on directory listing so both git-dumper modes and a
# manual gobuster walk work.
<Directory "/var/www/html/admin/.git">
    Require all granted
    Options +Indexes
    <IfModule mod_headers.c>
        Header unset Cache-Control
    </IfModule>
</Directory>

<Files ".gitignore">
    Require all granted
</Files>

# vuln 12 / vuln 19: make sure PHP actually executes under the upload dirs,
# including the shared FTP dropzone, so an uploaded webshell runs.
<Directory "/var/www/html/uploads">
    <FilesMatch "\.(php|php[0-9]|phtml)$">
        SetHandler application/x-httpd-php
    </FilesMatch>
    Options +Indexes
    Require all granted
</Directory>
