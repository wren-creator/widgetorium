// Widgetorium lab DNS. Authoritative-only, no recursion. Serves two zones so
// trainees can practise the reconnaissance phase against a real nameserver
// without touching public DNS or owning a domain.
//
// This file is mounted read-only at /etc/bind.src/named.conf. The container
// entrypoint copies it to /etc/bind.run/ and, when OPEN_AXFR=0, rewrites the
// corp zone's allow-transfer line before starting named.

options {
    directory "/var/cache/bind";
    recursion no;
    allow-query { any; };
    dnssec-validation no;
    listen-on { any; };
    listen-on-v6 { none; };
    // Quiet the "no root hints" noise; this server is authoritative-only.
    empty-zones-enable no;
};

// corp.widgetorium.lab -- the internal zone and the real recon target.
// allow-transfer is deliberately wide open (bug 20). The entrypoint swaps this
// for `allow-transfer { none; };` when OPEN_AXFR=0.
zone "corp.widgetorium.lab" {
    type master;
    file "/etc/bind.run/zones/db.corp.widgetorium.lab";
    allow-transfer { any; };   // BUG20_AXFR
};

// widgetorium.lab -- the public face. Transfers are locked down the way they
// should be, so the trainee sees the contrast with the internal zone.
zone "widgetorium.lab" {
    type master;
    file "/etc/bind.run/zones/db.widgetorium.lab";
    allow-transfer { none; };
};
